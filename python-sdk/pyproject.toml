[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qarax-api-client"
version = "0.1.0"
description = "Python SDK for Qarax API"
requires-python = ">=3.11"
dependencies = [
    "httpx2",
    "attrs",
]

[dependency-groups]
dev = [
    "openapi-python-client",
    "ruff==0.17.5",
]
