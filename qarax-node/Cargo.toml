[package]
name = "qarax-node"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tonic-build = "0.12.3"

[[bin]]
name = "qarax-node"
path = "src/main.rs"

[features]
default = []
otel = ["common/otel", "dep:opentelemetry", "dep:tracing-opentelemetry", "dep:tower", "dep:http"]
dhat-heap = ["dep:dhat"]

[dependencies]
prost = "0.13.5"
tokio = { version = "1.34.0", features = ["full", "process"] }
tokio-stream = { version = "0.1.14", features = ["sync"] }
common = { path = "../common" }
clap = { version = "4.4.8", features = ["derive", "env"] }
tracing = { version = "0.1.40", features = ["log"] }
tracing-subscriber = "0.3.18"
tonic = { version = "0.12.3", features = ["tls"] }
# tonic builds its TLS configs from rustls' process-wide crypto provider (see
# qarax_node::tls).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

anyhow = "1.0.75"
async-trait = "0.1"
uuid = { version = "1.6.1", features = ["v4"] }

# Cloud Hypervisor SDK
cloud-hypervisor-sdk = { git = "https://github.com/qarax/cloud-hypervisor-sdk.git", tag = "v54.1.0" }
nbdwire = { git = "https://github.com/qarax/nbdwire.git", tag = "v0.1.0" }

# Firecracker SDK
# v1.18.0 plus a fix its tag doesn't have (attaching to a new Firecracker no
# longer waits 100 ms). The SDK's tags are Firecracker's releases, so go back
# to `tag = "..."` with the next one.
firecracker-rust-sdk = { git = "https://github.com/qarax/firecracker-rust-sdk.git", rev = "cbc55f9bbb2120d059b07dba0092418d3a5707e2" }
gethostname = "0.5"

# HTTP client dependencies (same as SDK uses)
bytes = "1.5.0"
futures = "0.3.30"
http-body-util = "0.1.0"
hyper = { version = "1.2.0", features = ["client", "http1"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
nix = { version = "0.29", features = ["term", "fs"] }
fatfs = "0.3"
edge-dhcp = { version = "0.7", default-features = false, features = ["log"] }
socket2 = "0.5"
rtnetlink = "0.14"
netlink-packet-route = "0.19"
num_cpus = "1"

# OpenTelemetry (behind "otel" feature)
opentelemetry = { version = "0.33", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
tower = { version = "0.4", optional = true }
http = { version = "1", optional = true }

# Heap profiling (behind "dhat-heap" feature — never enable in production builds)
dhat = { version = "0.3", optional = true }

[dev-dependencies]
tokio-stream = { version = "0.1.14", features = ["net"] }
tempfile = "3"
