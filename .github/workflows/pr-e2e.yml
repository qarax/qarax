name: PR E2E

on:
  pull_request:
    branches: [master]
    types: [labeled]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event.label.name == 'run-e2e'
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release

      - name: Build release binaries
        run: make build-release

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: |
            target/x86_64-unknown-linux-musl/release/qarax-server
            target/x86_64-unknown-linux-musl/release/qarax-node
            target/x86_64-unknown-linux-musl/release/qarax-init
            target/x86_64-unknown-linux-musl/release/qarax
          retention-days: 1

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    # Runs take ~7 minutes; a hung VM or wait must not hold the runner for 6 hours.
    timeout-minutes: 60
    if: github.event.label.name == 'run-e2e'
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          name: binaries
          path: target/x86_64-unknown-linux-musl/release/

      - name: Make binaries executable
        run: chmod +x target/x86_64-unknown-linux-musl/release/*

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check KVM availability
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM is available"
            ls -la /dev/kvm
          else
            echo "KVM is NOT available - E2E tests will be skipped"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: true

      - name: Expose GitHub runtime for BuildKit cache
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            e2e/pyproject.toml
            e2e/uv.lock
            python-sdk/pyproject.toml
            python-sdk/uv.lock

      - name: Install e2e dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-utils

      - name: Run E2E tests
        run: SKIP_BUILD=1 ENABLE_OTEL=1 CLOUD_HYPERVISOR_VERSION=$(cat versions/cloud-hypervisor-version | tr -d '\n') bash e2e/run_e2e_tests.sh
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
          DOCKER_BUILDX: 1
          DOCKER_BUILD_CACHE_FROM: type=gha
          DOCKER_BUILD_CACHE_TO: type=gha,mode=max
          # Leave the stack up for the demo smoke step; Cleanup removes it.
          KEEP: 1
          # Also deploy to and upgrade the appliance as a bootc microVM node.
          ENABLE_BOOTC_UPGRADE_E2E: 1

      # Nothing else runs the demos, so a few fast ones run against the e2e
      # stack (two UP hosts) to catch a demo the code has broken.
      - name: Demo smoke
        run: |
          set -e
          run_demo() {
            echo "::group::demos/$*"
            bash "demos/$1/run.sh" "${@:2}"
            echo "::endgroup::"
          }
          run_demo vm-exec
          run_demo firecracker
          run_demo sse-events
          run_demo hooks
          run_demo network-isolation --cross-host
        env:
          SKIP_BUILD: 1

      - name: Cleanup
        if: always()
        working-directory: e2e
        run: docker compose --profile '*' down -v
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
