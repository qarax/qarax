# Overlay for running qarax-node in a libvirt VM instead of a container
# (hack/run-local.sh --vm, hack/test-host-deploy-libvirt.sh):
#   - qarax uses host networking, since libvirt's NAT network only accepts new
#     connections from the host itself, not from a Docker bridge.
#   - postgres publishes a loopback port of its own for that host-networked
#     qarax, so it can't collide with (or silently connect to) a test
#     Postgres on 5432.
#   - qarax no longer waits for node containers; none are started.
# Usage: docker compose -f docker-compose.yml -f docker-compose.vm-mode.yml up -d --wait registry postgres qarax
services:
  postgres:
    ports:
      - "127.0.0.1:15432:5432"
  qarax:
    network_mode: host
    ports: !reset []
    environment:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "15432"
    depends_on: !override
      postgres:
        condition: service_healthy
